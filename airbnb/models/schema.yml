models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: error
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null
      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                        'Private room',
                        'Shared room',
                        'Hotel room']
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values
  
  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: .99
                min_value: 50
                max_value: 500
              config:
                severity: warn
          - dbt_expectations.expect_column_max_to_be_between:
              arguments:
                max_value: 5000
                config:
                  severity: warn 
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number

  - name: dim_hosts_cleansed
    description: Cleansed table which contains Airbnb hosts.
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        defined_in: dim_hosts_cleansed_v2
        columns:
        - include: '*'
          exclude: [host_name]
        - name: host_name
          description: The name of the host (N/A if not available)
          data_type: string
          constraints:
            - type: not_null
    latest_version: 2
    config:
        contract:
          enforced: true
    columns:
      - name: host_id
        description: The host's id. Primary key for this model.
        data_type: integer
        data_tests:
          - unique
        constraints:
          - type: not_null
      - name: host_name
        description: The host's name. Cannot be null.
        data_type: string
        constraints:
          - type: not_null
      - name: is_superhost
        description: A 't' or 'f' string indicating whether the host is a superhost. 
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
      - name: updated_at
        description: Timestamp showing when the host record was last updated.
        data_type: timestamp
      - name: created_at
        description: Timestamp showing when the host record was created.
        data_type: timestamp
      